<style>
html,body{font-family:Poppins,system-ui,sans-serif}
#v{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}.pop{animation:pop .35s}
.no-sb::-webkit-scrollbar{display:none}.no-sb{scrollbar-width:none}
.map{background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/90px 90px,linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/90px 90px,linear-gradient(115deg,transparent 40%,#fde68a 40% 42%,transparent 42%) 0 0/260px 260px,#e2ecdf}
#sheet{transition:transform .35s}
.pin{background:#fff;border:2px solid;border-radius:12px;padding:2px 7px;font:700 10px Poppins,sans-serif;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);transform:translate(-50%,-110%)}
.leaflet-container{font-family:inherit}
.campus{background:#1e2a78;color:#fff;border:2px solid #fff;border-radius:99px;padding:4px 10px;font:700 10px Poppins,sans-serif;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(30,42,120,.4)}.campus.on{background:#7c3aed}
@keyframes aig{from{box-shadow:0 0 8px rgba(168,85,247,.4)}to{box-shadow:0 0 24px rgba(236,72,153,.85)}}.ai-pulse{animation:aig 2s infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}.scanl{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#a855f7,transparent);box-shadow:0 0 14px #a855f7;animation:scan 1.2s linear infinite alternate}
.chip{white-space:nowrap;padding:.4rem .9rem;border-radius:99px;font-size:12px;font-weight:600;border:1px solid #e2e8f0;background:#fff}.chip.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
.inp{width:100%;border:1px solid #e2e8f0;border-radius:.9rem;padding:.75rem;font-size:14px;outline:none;margin:.25rem 0 .75rem}.inp:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f622}
.btn{background:#3b82f6;color:#fff;font-weight:700;border-radius:1rem;padding:.9rem;width:100%;transition:.15s}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
</style></head>

let AH=65;function ahR(){const v=+$('#ahc').value||0;$('#aho').textContent=sol(Math.round(v*AH/100));$('#ahp').textContent=AH+'%'}
function ahorroM(){M(`<div class="bg-white w-full rounded-t-3xl p-6 pop"><p class="font-bold text-lg">Calculadora de ahorro</p><p class="text-xs text-slate-500 mb-3">¿Cuánto gastarías en tienda para este ciclo?</p><input id="ahc" type="number" class="inp" value="700" oninput="ahR()"><label class="text-xs font-semibold">Ahorro estimado vs. tienda: <b id="ahp"></b> (supuesto editable)</label><input type="range" min="30" max="80" value="${AH}" class="w-full my-2" oninput="AH=this.value;ahR()"><div class="bg-emerald-50 rounded-2xl p-4 text-center"><p class="text-xs text-emerald-800 font-semibold">Tu ahorro estimado con U2U</p><p id="aho" class="text-3xl font-black text-emerald-600"></p></div><button class="btn mt-4" onclick="X()">Listo</button></div>`);ahR()}
function manifM(){M(`<div class="bg-white w-full rounded-t-3xl p-6 pop max-h-[85%] overflow-y-auto no-sb"><p class="font-bold text-lg">💡 Manifiesto U2U · UPC</p><div class="text-sm text-slate-700 leading-relaxed space-y-2 mt-3"><p>U2U es una plataforma digital peruana pensada para reducir el costo de los materiales universitarios, enfocada en la <b>Universidad Peruana de Ciencias Aplicadas</b> y sus <b>4 sedes</b>: Monterrico, San Isidro, Villa y San Miguel.</p><p><b>Ciclos avanzados:</b> rentabilizan libros, calculadoras, cámaras y herramientas que ya no usan.</p><p><b>Ciclos iniciales:</b> compran o alquilan equipos a precios justos sin salir del campus.</p><p>Así fomentamos el ahorro estudiantil y una comunidad basada en el consumo responsable y la reutilización.</p></div><button class="btn mt-4" onclick="X()">Cerrar</button></div>`)}
/* ===================== V7: TIEMPO REAL (Socket.io) ===================== */
/* Si /socket.io/socket.io.js no carga (archivo abierto sin servidor), la app sigue en modo local simulado. */
const LV={me:null,role:'buyer',pref:null,uid:null,convs:{},pres:{sellers:0,total:0},chips:[]};
let sock=null;
try{LV.pref=JSON.parse(localStorage.getItem('u2u7')||'null');if(LV.pref&&LV.pref.role)LV.role=LV.pref.role}catch(e){}
const uname=()=>LV.me?LV.me.name:'Jared',tm=ts=>new Date(ts).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
/* un id por pestaña: dos pestañas del mismo navegador cuentan como dos personas */
function myUid(){if(LV.uid)return LV.uid;try{LV.uid=sessionStorage.getItem('u2uid')}catch(e){}if(!LV.uid){LV.uid='u_'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('u2uid',LV.uid)}catch(e){}}return LV.uid}
function setRole(r){LV.role=r;document.querySelectorAll('.rl').forEach(b=>{const on=b.dataset.role==r;b.classList.toggle('border-brand',on);b.classList.toggle('bg-blue-50',on);b.classList.toggle('border-slate-200',!on)})}
function liveJoin(name,role){LV.me={uid:myUid(),name,role};LV.pref={name,role};try{localStorage.setItem('u2u7',JSON.stringify(LV.pref))}catch(e){}if(sock&&sock.connected)sock.emit('join',LV.me)}
function logout(){if(sock&&sock.connected)sock.emit('leave');LV.me=null;LV.convs={};root('login')}

function liveStart(){if(!window.io)return;
 sock=io();
 sock.on('connect',()=>{if(LV.me)sock.emit('join',LV.me);presUI()});
 sock.on('disconnect',presUI);
 sock.on('presence',p=>{LV.pres=p;presUI()});
 sock.on('history',l=>{const old=LV.convs;LV.convs={};l.forEach(c=>{c.un=(old[c.key]&&old[c.key].un)||0;LV.convs[c.key]=c});if(S.s=='msgs')R(1);if(S.s=='lchat')lchatR(S.a);navDot()});
 sock.on('msg',onMsg)}
function onMsg(d){if(!LV.me)return;const k=d.conv.key;
 const c=LV.convs[k]||(LV.convs[k]={key:k,pid:d.conv.pid,buyerId:d.conv.buyerId,buyerName:d.conv.buyerName,msgs:[],un:0});
 if(c.msgs.some(m=>m.id==d.msg.id))return;c.msgs.push(d.msg);c.buyerName=d.conv.buyerName;
 const mine=d.msg.uid==LV.me.uid;
 if(S.s=='lchat'&&S.a==k)lchatR(k);
 else{if(!mine){c.un=(c.un||0)+1;toast('💬 '+d.msg.name+': '+d.msg.text.slice(0,40));try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}if(S.s=='msgs')R(1)}
 navDot()}

/* Indicadores */
function presUI(){const p=LV.pres||{sellers:0,total:0},ok=sock&&sock.connected;
 const a=$('#pres');if(a)a.textContent=ok?`🟢 ${p.total} conectado${p.total==1?'':'s'} ahora · ${p.sellers} vendedor${p.sellers==1?'':'es'} en línea`:(sock?'🔴 Conectando con el servidor…':'⚪ Modo local (sin servidor)');
 const b=$('#lst');if(b)b.innerHTML=!ok?'<span class="text-red-500">● reconectando…</span>':(LV.me&&LV.me.role=='seller')?'<span class="text-mint">● en línea</span>':p.sellers?'<span class="text-mint">● vendedor en línea</span>':'<span class="text-slate-400">○ sin vendedores ahora</span>'}
function navDot(){const b=document.querySelector('#nav [aria-label="Mensajes"]');if(!b)return;b.classList.add('relative');
 const n=Object.values(LV.convs).reduce((a,c)=>a+(c.un||0),0);let d=b.querySelector('.ud');
 if(n&&!d){b.insertAdjacentHTML('beforeend','<span class="ud absolute top-1 right-1 min-w-[16px] h-4 px-1 bg-pink-500 text-white rounded-full text-[10px] font-bold grid place-items-center"></span>');d=b.querySelector('.ud')}
 if(d){if(n)d.textContent=n;else d.remove()}}

/* Abrir chat / ofertas */
function openChat(pid){
 if(!window.io||!LV.me)return nav('chat',pid);
 if(LV.me.role=='seller'){toast('Eres Vendedor: las consultas llegan a Mensajes');return root('msgs')}
 nav('lchat',pid+'|'+LV.me.uid)}
function offerSend(id,v){const t='Hola, te ofrezco S/ '+v+' por '+P(id).t;
 if(!window.io||!LV.me){nav('chat',id);return send(id,t)}
 if(LV.me.role=='seller')return toast('Las ofertas las envían los compradores');
 const k=id+'|'+LV.me.uid;nav('lchat',k);lsend(k,t)}
function lsend(k,t){const i=$('#ci');t=(t||(i&&i.value)||'').trim();if(!t)return;
 if(!sock||!sock.connected)return toast('Sin conexión con el servidor, reintentando…');
 const[pid,bid]=k.split('|');
 sock.emit('send',{pid:+pid,buyerId:bid,text:t},r=>{if(r&&r.error)toast(r.error)});
 if(i){i.value='';i.focus()}}

/* Pantallas */
V.lchat=key=>{const[pid]=key.split('|'),p=P(pid)||{id:0,t:'Producto no disponible en este dispositivo',ph:[],e:'📦',mode:'venta',price:0,s:0},c=LV.convs[key],sl=LV.me.role=='seller',
 title=sl?esc(c?c.buyerName:'Comprador'):esc(SEL[p.s].n);
 LV.chips=sl?['¡Hola! Sí, sigue disponible 😊','Nos vemos en el punto seguro del campus','¿Cuánto ofreces?','¡Trato hecho! 🎉']:(p.id?aiChips(p):['¿Sigue disponible?']);
 return `<div class="h-full flex flex-col">${hd(title,'<span id="lst" class="text-xs font-semibold"></span>')}
 <div ${p.id?`onclick="openP(${p.id})"`:''} class="flex gap-3 items-center p-3 bg-slate-50 border-b cursor-pointer"><div class="w-12 h-12 rounded-lg overflow-hidden">${pic(p)}</div><div class="flex-1 min-w-0"><p class="text-sm font-bold truncate">${esc(p.t)}</p>${p.id?`<p class="text-xs text-brand font-bold">${price(p)}</p>`:''}</div></div>
 <div id="ml" class="flex-1 overflow-y-auto no-sb p-4 space-y-2 bg-slate-50"></div>
 <div class="flex gap-2 overflow-x-auto no-sb px-3 pt-2 items-center"><span class="text-[10px] font-bold text-purple-600 shrink-0">${sl?'⚡ Respuestas rápidas':'✨ IA sugiere'}</span>${LV.chips.map((q,i)=>`<button class="chip" onclick="lsend('${key}',LV.chips[${i}])">${esc(q)}</button>`).join('')}</div>
 <div class="flex gap-2 p-3"><input id="ci" onkeydown="event.key=='Enter'&&lsend('${key}')" autocomplete="off" placeholder="Escribe un mensaje..." class="flex-1 bg-slate-100 rounded-full px-4 py-3 text-sm outline-none"><button onclick="lsend('${key}')" aria-label="Enviar" class="bg-brand text-white rounded-full p-3"><i data-lucide="send" class="w-5"></i></button></div></div>`};
function lchatR(k){const m=$('#ml');if(!m)return;const c=LV.convs[k];if(c)c.un=0;
 m.innerHTML=c&&c.msgs.length?c.msgs.map(x=>{const me=x.uid==LV.me.uid;return `<div class="flex ${me?'justify-end':''}"><div class="max-w-[78%]">${me?'':`<p class="text-[10px] text-slate-400 ml-1">${esc(x.name)} · ${x.from=='seller'?'Vendedor':'Comprador'}</p>`}<div class="px-3 py-2 rounded-2xl text-sm break-words ${me?'bg-brand text-white rounded-br-sm':'bg-white border rounded-bl-sm'}">${esc(x.text)}<p class="text-[9px] opacity-60 text-right">${tm(x.ts)}</p></div></div></div>`}).join(''):'<p class="text-center text-xs text-slate-400 mt-10">Escribe o usa una respuesta rápida para empezar.</p>';
 m.scrollTop=m.scrollHeight;navDot()}
function liveMsgs(){const sl=LV.me.role=='seller',l=Object.values(LV.convs).filter(c=>c.msgs.length).sort((a,b)=>b.msgs[b.msgs.length-1].ts-a.msgs[a.msgs.length-1].ts);
 return `<div class="p-5 pb-28"><div class="flex items-center justify-between mb-4"><h1 class="text-2xl font-bold">Mensajes</h1><span class="text-[11px] font-bold px-3 py-1 rounded-full ${sl?'bg-emerald-100 text-emerald-700':'bg-blue-100 text-blue-700'}">${sl?'🏷️ Vendedor':'🛒 Comprador'}</span></div>
 ${l.map(c=>{const p=P(c.pid),m=c.msgs[c.msgs.length-1],mine=m.uid==LV.me.uid;if(!p)return '';
  return `<div onclick="nav('lchat','${c.key}')" class="flex gap-3 items-center py-3 border-b cursor-pointer"><div class="w-14 h-14 rounded-xl overflow-hidden">${pic(p)}</div><div class="flex-1 min-w-0"><p class="font-bold text-sm">${sl?esc(c.buyerName):esc(SEL[p.s].n)}</p><p class="text-xs text-slate-500 truncate">${esc(p.t)}</p><p class="text-xs truncate ${mine?'text-slate-400':'text-slate-700 font-semibold'}">${mine?'Tú: ':''}${esc(m.text)}</p></div><div class="flex flex-col items-end gap-1"><span class="text-[10px] text-slate-400">${tm(m.ts)}</span>${c.un?`<span class="min-w-[18px] h-[18px] px-1 bg-pink-500 text-white rounded-full text-[10px] font-bold grid place-items-center">${c.un}</span>`:''}</div></div>`}).join('')
 ||`<p class="text-center text-slate-400 py-16 text-sm">${sl?'Aún no hay consultas.<br>Cuando un comprador te escriba, aparecerá aquí en tiempo real.':'Aún no tienes conversaciones.<br>Abre un producto y toca el chat para escribirle al vendedor.'}</p>`}</div>`}
const _vMsgs=V.msgs;V.msgs=a=>(window.io&&LV.me)?liveMsgs():_vMsgs(a);

/* Tras cada render: pintar mensajes, punto de no leídos y estado de conexión */
